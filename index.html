            <div style={{position:"absolute",top:0,left:0,right:0,height:3,background:k.c,borderRadius:"16px 16px 0 0"}}/>
            <div style={S.lbl}>{k.l}</div>
            <div style={{fontSize:22,fontWeight:700,color:k.c,lineHeight:1,marginBottom:4}}>{k.v}</div>
            <div style={{fontSize:11,color:"#6B7280"}}>{k.sub}</div>
          </div>)}
        </div>
        <div style={S.card}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
            <div style={{fontSize:14,fontWeight:600}}>Mails del lanzamiento</div>
            <div style={{display:"flex",gap:6}}>
              {[["all","Todos"],["conversion","Conversión"],["nurturing","Nurturing"]].map(([v,l])=>
                <button key={v} onClick={()=>setMailFilt(v)} style={{fontSize:12,fontWeight:500,padding:"5px 12px",borderRadius:20,border:"1px solid",cursor:"pointer",fontFamily:"inherit",
                  background:mailFilt===v?(v==="nurturing"?"#EDE9FE":v==="conversion"?"#DBEAFE":"#1a1f4e"):"#fff",
                  color:mailFilt===v?(v==="nurturing"?"#5B21B6":v==="conversion"?"#1E40AF":"#fff"):"#6B7280",
                  borderColor:mailFilt===v?(v==="nurturing"?"#C4B5FD":v==="conversion"?"#BFDBFE":"#1a1f4e"):"#E5E7EB"
                }}>{l}</button>
              )}
            </div>
          </div>
          <table style={{width:"100%",borderCollapse:"collapse",fontSize:12}}>
            <thead><tr style={{borderBottom:"1px solid #F3F4F6"}}>
              {["Fecha","Asunto","Tipo","Enviados","Apertura%","CTR%"].map(h=>
                <th key={h} style={{...S.th,textAlign:["Fecha","Asunto","Tipo"].includes(h)?"left":"right"}}>{h}</th>
              )}
            </tr></thead>
            <tbody>{mailsFilt.map((m,i)=>{
              const fch=new Date(m.fecha+"T12:00:00").toLocaleDateString("es-MX",{day:"numeric",month:"short"});
              const isN=m.tipo==="nurturing";
              return<tr key={i} style={{borderBottom:"1px solid #F9FAFB"}}>
                <td style={{...S.td,color:"#6B7280",whiteSpace:"nowrap"}}>{fch}</td>
                <td style={{...S.td,maxWidth:280,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}} title={m.asunto}>{m.asunto}</td>
                <td style={S.td}><span style={{fontSize:9,fontWeight:600,padding:"1px 6px",borderRadius:20,
                  background:isN?"#EDE9FE":"#DBEAFE",color:isN?"#5B21B6":"#1E40AF"}}>{isN?"Nurturing":"Conversión"}</span></td>
                <td style={{...S.td,textAlign:"right",color:"#6B7280"}}>{m.enviados.toLocaleString("es-MX")}</td>
                <td style={{...S.td,textAlign:"right",fontWeight:600,color:m.apertura>=40?"#16a348":m.apertura>=25?"#d97706":"#dc2626"}}>{m.apertura}%</td>
                <td style={{...S.td,textAlign:"right",fontWeight:500,color:m.ctr>=1?"#16a348":m.ctr>=0.3?"#d97706":"#9CA3AF"}}>{m.ctr}%</td>
              </tr>;
            })}</tbody>
            <tfoot><tr style={{borderTop:"2px solid #E5E7EB"}}>
              <td colSpan={3} style={{...S.td,fontWeight:600,fontSize:11,color:"#6B7280"}}>{mailsFilt.length} mails</td>
              <td style={{...S.td,textAlign:"right",color:"#6B7280"}}>{mailsFilt.reduce((s,m)=>s+m.enviados,0).toLocaleString("es-MX")}</td>
              <td style={{...S.td,textAlign:"right",fontWeight:600}}>{avgAp(mailsFilt)}%</td>
              <td style={{...S.td,textAlign:"right",fontWeight:500}}>{avgCtr(mailsFilt)}%</td>
            </tr></tfoot>
          </table>
        </div>
      </div>;
    })()}

    

    {tab==="calendario"&&<div style={S.card}>
      <div style={{fontSize:14,fontWeight:600,marginBottom:16}}>Calendario del lanzamiento</div>
      {[{f:"8 Abr",t:"Webinar apertura + inicio venta bootcamp",d:"13hs · Apertura $47 · Inicio Meta Ads"},{f:"8 Abr-5 May",t:"Venta Bootcamp (28 dias)",d:"Meta: obj 2,000 ventas · Ads escalando"},{f:"Mar 21 Abr",t:"VIVO #1 - Instagram 11:30hs",d:"Primer pico esperado"},{f:"Jue 24 Abr",t:"VIVO #2 + Bono sorpresa",d:"Segundo pico · bono activa urgencia"},{f:"Mar 28 Abr",t:"VIVO #3",d:"Tercer pico · recta final"},{f:"Jue 30 Abr",t:"Bono ultimos dias",d:"Urgencia cierre · 1 May feriado AR"},{f:"26 Abr-5 May",t:"Cierre con push",d:"~$5,000-6,500/dia · ultimo dia fuerte"},{f:"6 May",t:"Clase 1 - Con quien jugas",d:"12-13:30hs"},{f:"8 May",t:"Clase 2 - Como jugas",d:"12-13:30hs"},{f:"12 May",t:"Clase 3 + Pitch NE",d:"12hs · Carrito NE abre al cierre"},{f:"12-20 May",t:"Venta NE (9 dias)",d:"200 ventas · $1,997 · Remarketing $20k"},{f:"28 May-4 Jun",t:"Downsell",d:"Starter Pack · $297"}].map((item,i)=><div key={i} style={{display:"flex",gap:14,padding:"12px 0",borderBottom:"1px solid #F9FAFB"}}><span style={{fontSize:11,fontWeight:600,color:"#9CA3AF",width:110,flexShrink:0,paddingTop:2}}>{item.f}</span><div style={{width:8,height:8,borderRadius:"50%",background:"#1a1f4e",flexShrink:0,marginTop:4}}/><div><div style={{fontSize:13,fontWeight:500,marginBottom:4}}>{item.t}</div><div style={{fontSize:12,color:"#6B7280"}}>{item.d}</div></div></div>)}
    </div>}

    </div></div>);
}
const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App/>);

</script></body></html>
